spring.application.name=identity-platform
server.address=127.0.0.1
server.port=8081
server.servlet.session.cookie.name=PRODUCT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m
identity.keycloak-base-url=http://127.0.0.1:8180
identity.consumer-issuer=${identity.keycloak-base-url}/realms/consumer
identity.product-id=product-a
identity.product-name=\u7edf\u4e00\u8d26\u6237\u4e2d\u5fc3
identity.api-audience=consumer-api
identity.client-id=consumer-web
identity.other-product=http://127.0.0.1:8082
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-missing-creator-properties=true
identity.consumer-initial-credits=0
spring.datasource.hikari.maximum-pool-size=5
spring.security.oauth2.client.registration.consumer.provider=keycloak-consumer
spring.security.oauth2.client.registration.consumer.client-id=${identity.client-id}
spring.security.oauth2.client.registration.consumer.client-secret=${identity.consumer-client-secret}
spring.security.oauth2.client.registration.consumer.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.consumer.scope=openid,profile,email
spring.security.oauth2.client.registration.consumer.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak-consumer.issuer-uri=${identity.consumer-issuer}
server.error.include-message=never
spring.thymeleaf.cache=false
